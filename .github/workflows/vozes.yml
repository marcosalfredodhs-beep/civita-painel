# Gera os áudios de vendedores e prêmios novos e publica (o push na main dispara o deploy da Vercel).
name: Vozes de vendedores novos
on:
  schedule:
    - cron: "*/30 10-23 * * *" # a cada 30 min, das 7h às 20h de Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency: vozes
jobs:
  vozes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.3.1
      - run: python3 scripts/vozes_novos.py
      - name: Publica se gerou algo
        run: |
          git add -A web/vozes scripts/vozes_pessoas.json scripts/vozes_premios.json
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vozes: áudios de vendedores ou prêmios novos"
          git push
